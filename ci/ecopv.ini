; Compilation du firmware EcoPV (Arduino Nano) : pio ci EcoPV3/EcoPV3.ino --project-conf ci/ecopv.ini -e nano

[env:nano]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
lib_deps =
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@4.0.6

[env:nano_oled]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
build_flags = -DOLED_128X64
lib_deps =
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@4.0.6
	greiman/SSD1306Ascii@1.3.5
