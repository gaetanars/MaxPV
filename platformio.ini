; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = MaxPV3
data_dir = MaxPV3/data
lib_dir = Librairies IDE

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
lib_compat_mode = strict
lib_deps = 
	bblanchon/ArduinoJson@6.21.6
	toshik/TickerScheduler@1.0.2
	khoih-prog/AsyncMQTT_Generic@1.8.1
	https://github.com/ayushsharma82/AsyncElegantOTA.git#v2.2.8
	arduino-libraries/NTPClient@3.2.1
	alanswx/ESPAsyncWiFiManager@0.31
	xreef/SimpleFTPServer@2.1.11
	khoih-prog/AsyncHTTPRequest_Generic@1.13.0
	akajes/AsyncPing(esp8266)@1.1.0
lib_ignore = STM32AsyncTCP
extra_scripts = 
	pre:extra_script.py
