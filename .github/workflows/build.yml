name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: ./actionlint -color
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check blueprints
        run: |
          python3 -m pip install pyyaml==6.0.2
          python3 -I scripts/check_blueprints.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'ci/*.ini') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install PlatformIO Core
        run: pip install platformio==6.2.0

      - name: Build ESP firmware
        run: pio run -e d1_mini
      - name: Build ESP filesystem
        run: pio run -t buildfs -e d1_mini
      - name: Build ESP full image
        working-directory: .pio/build/d1_mini
        run: |
          python -m pip install esptool==5.6.0
          fw=$(ls MaxPV*_firmware.bin)
          base=${fw%_firmware.bin}
          esptool --chip esp8266 merge-bin -o "${base}_full.bin" 0x0 "$fw" 0x300000 "${base}_filesystem.bin"
          expected=$((0x300000 + $(stat -c %s "${base}_filesystem.bin")))
          test "$(stat -c %s "${base}_full.bin")" -eq "$expected"
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maxpv-firmware
          path: .pio/build/d1_mini/*.bin
          if-no-files-found: error

      - name: Tests natifs
        run: pio test -e native

      - name: Build EcoPV (Nano)
        run: pio ci EcoPV/EcoPV.ino --project-conf ci/ecopv.ini -e nano
      - name: Build EcoPV (Nano, écran oLed)
        run: pio ci EcoPV/EcoPV.ino --project-conf ci/ecopv.ini -e nano_oled

      - name: Static analysis (non bloquant)
        continue-on-error: true
        run: pio check -e d1_mini

  release:
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_versions.py --tag "$TAG"
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maxpv-firmware
          path: dist
      - name: Prepare fixed-name assets
        working-directory: dist
        run: |
          cp MaxPV[0-9]*_firmware.bin MaxPV_firmware.bin
          cp MaxPV[0-9]*_filesystem.bin MaxPV_filesystem.bin
          cp MaxPV[0-9]*_full.bin MaxPV_full.bin
          ls -l
          test "$(find . -maxdepth 1 -name "*.bin" | wc -l)" -eq 6
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" MaxPV*_firmware.bin MaxPV*_filesystem.bin MaxPV*_full.bin --clobber
